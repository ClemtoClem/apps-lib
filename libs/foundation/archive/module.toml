[module]
name = "archive"
version = "1.0.0"
description = "Archives and compression in standard C++: ZIP, 7z, RAR (v4/v5), TAR, GZIP, BZIP2, XZ/LZMA, Zstandard, ISO 9660; read, write, virtual file tree, AES"
type = "static"              # static | shared | header-only

[sources]
dirs = ["src"]
# exclude = ["src/experimental/**"]

[include]
public = ["include"]      # propagé aux modules dépendants
private = ["src"]

[dependencies]
modules = ["foundation.core"]
pkg_config = []           # ex. ["zlib", "libcurl"]
system = []               # ex. ["m", "pthread"]

[flags]
defines = []
public_defines = []
cflags = []
cxxflags = []

[tests]
dirs = ["tests"]

# Surcharges par plate-forme cible (linux | windows | macos | android | unix…)
# [platform.windows]
# system = ["ws2_32"]

[review]
status = "approved"
date = "2026-11-15"
